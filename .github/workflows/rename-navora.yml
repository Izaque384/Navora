name: Rename BarberOne to Navora

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy brand references
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'BarberOne': 'Navora',
              'BARBERONE': 'NAVORA',
              'barberone': 'navora',
              'B1': 'N',
          }
          for name in ['index(1).html', 'package(1).json']:
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              new = text
              for old, value in replacements.items():
                  new = new.replace(old, value)
              if new != text:
                  path.write_text(new, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'index(1).html' 'package(1).json'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'refactor: rename BarberOne to Navora'
          git push
